projects:
  - title: "Whirling Wishes"
    category: "Interactive Media Art"
    tools: "Computer Vision, Sensing"
    period: "Oct. 2025 -- Dec. 2025"
    highlights:
      - "관람객의 호흡과 종이 바람개비 회전을 대형 디스플레이의 디지털 애니메이션으로 시각화하는 인터랙티브 설치 작품 개발 및 화순전남대학교병원 전시."
      - "해당 설치 연구 성과가 ACM SIGGRAPH Asia 2026 포스터 발표(Accepted)로 채택."
  - title: "Gate Guardian"
    category: "In-Vehicle AR Action Game"
    tools: "Unity, Meta Quest 3"
    period: "Dec. 2023 -- Nov. 2024"
    highlights:
      - "레벨 4 자율주행 주행 환경 시뮬레이션을 Unity로 제작하고, 차량 내에서 플레이 가능한 AR 액션 슈팅 게임 구축."
      - "Meta Quest 3를 활용해 시뮬레이션 환경 내 건물 및 차량 객체를 기반으로 몬스터를 생성하는 차량 내 AR 게임 콘셉트를 제안하고, 한국스마트미디어학회(2024)에 논문 게재."
  - title: "BAG DUST"
    category: "3D Competitive Party Brawler"
    tools: "Unity"
    period: "Sep. 2022 -- Dec. 2022"
    highlights:
      - "게임패드 컨트롤러 입력을 통한 실시간 4인 로컬 멀티플레이어(Local Multiplayer) 대전 및 물리 기반 상호작용을 구현하여 Unity 기반 3D 대전 파티 난투 게임 개발."
  - title: "Shadow Bookmark"
    category: "Interactive Media Game"
    tools: "Computer Vision, OpenCV"
    period: "Mar. 2022 -- Nov. 2022"
    highlights:
      - "8명 규모 팀의 PM 및 개발자로 참여하여, 물리적 그림자를 게임플레이 입력으로 활용하는 실시간 그림자 감지 알고리즘을 적용한 인터랙티브 퍼즐 게임 개발."
      - "국내 특허 등록(KR 10-2916268) 및 한국게임학회 2023 춘계학술대회에 입출력 인터랙션 연구 논문 게재."
  - title: "Express Agent"
    category: "Action Rogue-lite Shooter"
    tools: "Unity"
    period: "Mar. 2022 -- Jul. 2022"
    highlights:
      - "과거와 현재의 시간대를 넘나들며 협력하는 듀얼 주인공 시스템을 특징으로 하는 액션 슈팅 로그라이트 게임 개발."
  - title: "Large Vehicle AR HUD System"
    category: "AR HUD Solution"
    tools: "LiDAR, Camera Sensor Fusion"
    period: "Jun. 2021 -- Nov. 2021"
    highlights:
      - "전방 위험 감지 및 운전자 시선 유도를 위해 라이다(LiDAR)와 카메라 입력을 결합한 센서 퓨전 AR HUD 시스템 설계 및 구축."
  - title: "Air Force Fitness Test Support System"
    category: "Mobile Web Portal"
    tools: "Web, Database"
    period: "Mar. 2021"
    highlights:
      - "장병들이 체력검정 결과를 직접 기록, 추적 및 검증할 수 있는 군 내부 모바일 웹 시스템 구축."

